version: "3"

vars:
  CLUSTER_NAME: platform-lab
  OPERATOR_IMAGE: greeting-operator:dev
  GREETING_NAME: hello
  PLATFORM_OPERATOR_IMAGE: platform-operator:dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tools:check:
    desc: Check required development tools
    cmds:
      - java --version
      - docker --version
      - kubectl version --client
      - kind version
      - task --version

  cluster:create:
    desc: Create the local Kind cluster
    cmds:
      - kind create cluster
        --name {{.CLUSTER_NAME}}
        --config cluster/kind/cluster.yaml
    status:
      - kind get clusters | grep -q "^{{.CLUSTER_NAME}}$"

  cluster:delete:
    desc: Delete the local Kind cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}

  cluster:status:
    desc: Show local Kubernetes cluster status
    cmds:
      - kubectl cluster-info
      - kubectl get nodes
      - kubectl get pods -A

  crd:install:
    desc: Install platform CRDs
    cmds:
      - kubectl apply -f k8s/crds/

  crd:delete:
    desc: Delete platform CRDs
    cmds:
      - kubectl delete -f k8s/crds/ --ignore-not-found

  greeting:create:
    desc: Create sample Greeting resource
    cmds:
      - kubectl apply -f k8s/samples/greeting.yaml

  greeting:get:
    desc: List Greeting resources
    cmds:
      - kubectl get greetings

  greeting:describe:
    desc: Describe the sample Greeting
    cmds:
      - kubectl describe greeting hello

  greeting:status:
    desc: Show Greeting including operator status
    cmds:
      - kubectl get greeting hello -o yaml

  greeting:delete:
    desc: Delete sample Greeting
    cmds:
      - kubectl delete -f k8s/samples/greeting.yaml --ignore-not-found

  greeting:events:
    desc: Show events for the sample Greeting
    cmds:
      - kubectl describe greeting hello

  greeting:reconcile:
    desc: Manually trigger Greeting reconciliation
    cmds:
      - |
        kubectl annotate greeting {{.GREETING_NAME}} \
          platform.shubforge.dev/reconcile-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --overwrite

  operator:build:
    desc: Build Greeting operator
    cmds:
      - ./mvnw -f operators/greeting-operator/pom.xml clean package

  operator:run:
    desc: Run Greeting operator locally
    cmds:
      - ./mvnw -f operators/greeting-operator/pom.xml compile exec:java


  operator:image:build:
    desc: Build Greeting operator Docker image
    deps:
      - operator:build
    cmds:
      - docker build
        -t {{.OPERATOR_IMAGE}}
        operators/greeting-operator

  operator:image:load:
    desc: Load Greeting operator image into Kind
    cmds:
      - kind load docker-image
        {{.OPERATOR_IMAGE}}
        --name {{.CLUSTER_NAME}}


  operator:deploy:
    desc: Deploy Greeting operator into Kubernetes
    cmds:
      - kubectl apply -f k8s/operator/namespace.yaml
      - kubectl apply -f k8s/operator/service-account.yaml
      - kubectl apply -f k8s/operator/rbac.yaml
      - kubectl apply -f k8s/operator/deployment.yaml

  operator:undeploy:
    desc: Remove Greeting operator from Kubernetes
    cmds:
      - kubectl delete -f k8s/operator/deployment.yaml --ignore-not-found
      - kubectl delete -f k8s/operator/rbac.yaml --ignore-not-found
      - kubectl delete -f k8s/operator/service-account.yaml --ignore-not-found
      - kubectl delete -f k8s/operator/namespace.yaml --ignore-not-found

  operator:status:
    desc: Show Greeting operator status
    cmds:
      - kubectl get pods -n platform-system
      - kubectl get deployment greeting-operator -n platform-system

  operator:logs:
    desc: Follow Greeting operator logs
    cmds:
      - kubectl logs
        -n platform-system
        deployment/greeting-operator
        -f
  operator:restart:
    desc: Restart Greeting operator and wait for rollout
    cmds:
      - kubectl rollout restart
        deployment/greeting-operator
        -n platform-system
      - kubectl rollout status
        deployment/greeting-operator
        -n platform-system


  application:crd:install:
    desc: Install the Application CRD
    cmds:
      - kubectl apply -f k8s/crds/applications.yaml

  application:crd:delete:
    desc: Delete the Application CRD
    cmds:
      - kubectl delete -f k8s/crds/applications.yaml --ignore-not-found

  application:create:
    desc: Create the sample Application
    cmds:
      - kubectl apply -f k8s/samples/application.yaml

  application:get:
    desc: List Applications
    cmds:
      - kubectl get applications.platform.shubforge.dev

  application:describe:
    desc: Describe the sample Application
    cmds:
      - kubectl describe application greeting-service

  application:delete:
    desc: Delete the sample Application
    cmds:
      - kubectl delete application greeting-service --ignore-not-found

  application:test:api:
    desc: Test the Application API and CRD validation
    cmds:
      - bash ./scripts/tests/application-api-test.sh

  application:test:controller:
    desc: Test Application controller provisioning
    cmds:
      - bash ./scripts/tests/application-controller-test.sh

  application:update:
    desc: Update the sample Application
    cmds:
      - |
        kubectl patch application greeting-service \
          --type=merge \
          -p '{
            "spec": {
              "image": "greeting-service:2.0.0",
              "replicas": 3,
              "port": {
                "containerPort": 9090
              }
            }
          }'
  platform-operator:build:
    desc: Build the Platform Operator
    cmds:
      - ./mvnw -f operators/platform-operator/pom.xml clean package

  platform-operator:image:build:
    desc: Build the Platform Operator Docker image
    deps:
      - platform-operator:build
    cmds:
      - docker build
        -t {{.PLATFORM_OPERATOR_IMAGE}}
        operators/platform-operator

  platform-operator:image:load:
    desc: Load the Platform Operator image into Kind
    cmds:
      - kind load docker-image
        {{.PLATFORM_OPERATOR_IMAGE}}
        --name {{.CLUSTER_NAME}}

  platform-operator:deploy:
    desc: Deploy the Platform Operator
    cmds:
      - kubectl apply -f k8s/platform-operator/namespace.yaml
      - kubectl apply -f k8s/platform-operator/service-account.yaml
      - kubectl apply -f k8s/platform-operator/rbac.yaml
      - kubectl apply -f k8s/platform-operator/deployment.yaml

  platform-operator:restart:
    desc: Restart the Platform Operator
    cmds:
      - kubectl rollout restart
        deployment/platform-operator
        -n platform-system

      - kubectl rollout status
        deployment/platform-operator
        -n platform-system

  platform-operator:status:
    desc: Show Platform Operator status
    cmds:
      - kubectl get pods
        -n platform-system
        -l app=platform-operator

  platform-operator:logs:
    desc: Follow Platform Operator logs
    cmds:
      - kubectl logs
        -n platform-system
        deployment/platform-operator
        -f

  platform-operator:test:
    desc: Run Platform Operator unit tests
    cmds:
      - ./mvnw -f operators/platform-operator/pom.xml test
