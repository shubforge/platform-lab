apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: applications.platform.shubforge.dev

spec:
  group: platform.shubforge.dev

  scope: Namespaced

  names:
    plural: applications
    singular: application
    kind: Application

    shortNames:
      - papp

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              required:
                - image
                - port

              properties:
                image:
                  type: string
                  minLength: 1

                replicas:
                  type: integer
                  minimum: 1
                  default: 1

                port:
                  type: object

                  required:
                    - containerPort

                  properties:
                    containerPort:
                      type: integer
                      minimum: 1
                      maximum: 65535

            status:
              type: object

              properties:
                observedGeneration:
                  type: integer
                  format: int64

                deploymentName:
                  type: string

                serviceName:
                  type: string

                readyReplicas:
                  type: integer
                  format: int32

                conditions:
                  type: array

                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type

                  items:
                    type: object

                    required:
                      - type
                      - status

                    properties:
                      type:
                        type: string

                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"

                      observedGeneration:
                        type: integer
                        format: int64

                      lastTransitionTime:
                        type: string
                        format: date-time

                      reason:
                        type: string

                      message:
                        type: string

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status

        - name: Image
          type: string
          jsonPath: .spec.image

        - name: Replicas
          type: integer
          jsonPath: .spec.replicas

        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
