apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: greetings.platform.shubforge.dev

spec:
  group: platform.shubforge.dev

  scope: Namespaced

  names:
    plural: greetings
    singular: greeting
    kind: Greeting
    shortNames:
      - greet

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                message:
                  type: string

              required:
                - message
