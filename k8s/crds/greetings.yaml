apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: greetings.platform.shubforge.dev

spec:
  group: platform.shubforge.dev

  scope: Namespaced

  names:
    plural: greetings
    singular: greeting
    kind: Greeting
    shortNames:
      - greet

  versions:
    - name: v1alpha1
      served: true
      storage: true

      subresources:
        status: { }

      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status

        - name: ConfigMap
          type: string
          jsonPath: .status.configMapName

        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      schema:
        openAPIV3Schema:
          type: object

          properties:

            spec:
              type: object

              properties:
                message:
                  type: string

              required:
                - message

            status:
              type: object

              properties:

                observedGeneration:
                  type: integer
                  format: int64

                configMapName:
                  type: string

                conditions:
                  type: array

                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type

                  items:
                    type: object

                    properties:

                      type:
                        type: string

                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"

                      observedGeneration:
                        type: integer
                        format: int64

                      lastTransitionTime:
                        type: string
                        format: date-time

                      reason:
                        type: string

                      message:
                        type: string

                    required:
                      - type
                      - status
