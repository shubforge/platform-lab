apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: greeting-operator

rules:

  - apiGroups:
      - platform.shubforge.dev
    resources:
      - greetings
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups:
      - platform.shubforge.dev
    resources:
      - greetings/status
    verbs:
      - get
      - patch
      - update

  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: greeting-operator

subjects:

  - kind: ServiceAccount
    name: greeting-operator
    namespace: platform-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: greeting-operator
