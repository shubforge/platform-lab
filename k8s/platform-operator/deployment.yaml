apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-operator
  namespace: platform-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: platform-operator

  template:

    metadata:
      labels:
        app: platform-operator

    spec:

      serviceAccountName: platform-operator

      containers:

        - name: platform-operator

          image: platform-operator:dev

          imagePullPolicy: IfNotPresent

          resources:

            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi
