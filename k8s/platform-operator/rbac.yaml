apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: platform-operator

rules:

  - apiGroups:
      - platform.shubforge.dev

    resources:
      - applications

    verbs:
      - get
      - list
      - watch
      - patch
      - update


  - apiGroups:
      - platform.shubforge.dev

    resources:
      - applications/status

    verbs:
      - get
      - patch
      - update


  - apiGroups:
      - apps

    resources:
      - deployments

    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete


  - apiGroups:
      - ""

    resources:
      - services

    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: platform-operator

subjects:

  - kind: ServiceAccount
    name: platform-operator
    namespace: platform-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-operator
